<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #eef2f7;
      padding: 30px;
    }
    .form-container {
      max-width: 600px;
      margin: auto;
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.08);
    }
    h1 {
      text-align: center;
      color: #0077cc;
      margin-bottom: 20px;
    }
    h2 {
      text-align: center;
      color: #ffc107;
      margin-bottom: 20px;
    }
    label {
      font-weight: 600;
      display: block;
      margin-top: 1rem;
    }
    input[type="text"], select, input[type="date"], input[type="time"], input[type="number"], textarea, input[type="file"] {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    select[multiple], .checkbox-group {
      height: auto;
      padding: 10px;
      border: 1px solid #ccc;
      background: #f9f9f9;
      border-radius: 5px;
      max-height: 200px;
      overflow-y: auto;
    }
    .checkbox-group label {
      display: block;
      margin-bottom: 4px;
      font-weight: normal;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 10px;
      background: #0077cc;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }
    button:hover {
      background-color: #005fa3;
      transform: scale(1.05);
    }
    button:active {
      transform: scale(0.97);
    }
    .problem-btn {
      background: #ffc107;
      color: #000;
      font-weight: 600;
    }
    .problem-btn:hover {
      background: #e0a800;
    }
    .address {
      text-align: center;
      font-size: 14px;
      color: #555;
      margin-bottom: 20px;
      font-weight: 500;
    }
    .section {
      margin-top: 20px;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #f8f8f8;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      z-index: 1000;
      overflow-y: auto;
      padding: 20px;
    }
    .modal-content {
      max-width: 600px;
      margin: 30px auto;
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .btn-group button {
      flex: 1;
    }
    .cancel-btn {
      background: #dc3545;
    }
    .cancel-btn:hover {
      background: #c82333;
    }
    footer {
      position: fixed;
      bottom: 0;
      right: 0;
      padding: 8px 12px;
      font-size: 8px;
      color: #555;
    }
    .auto-filled {
      background-color: #e8f5e9 !important;
      border-color: #4caf50 !important;
    }
  </style>
</head>

  <script>
    // Your Google Apps Script Web App URL - UPDATE THIS WITH YOUR URL
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyo_TQwiIQSbLwNwUeU2Hwauk8DDdbTTaIDYs6iVOvzryJnKRCgb8tCCaP9sirpiSAY/exec";

    function getParam(name) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(name);
    }

    function toggleSections() {
      const dept = document.getElementById('department').value;
      document.getElementById('coreAssemblySection').style.display = (dept === 'CORE ASSEMBLY') ? 'block' : 'none';
      document.getElementById('coilAssemblySection').style.display = (dept === 'COIL ASSEMBLY') ? 'block' : 'none';
      document.getElementById('meggerSection').style.display = (dept === 'MEGGER') ? 'block' : 'none';
      document.getElementById('fabricationLidSection').style.display = (dept === 'FABRICATION LID') ? 'block' : 'none';
      document.getElementById('ovenOutSection').style.display = (dept === 'OVEN OUT') ? 'block' : 'none';
      document.getElementById('ovenInSection').style.display = (dept === 'OVEN IN') ? 'block' : 'none';
      document.getElementById('tankUpSection').style.display = (dept === 'TANK UP') ? 'block' : 'none';
      document.getElementById('testingSection').style.display = (dept === 'TESTING') ? 'block' : 'none';
      document.getElementById('topYokeSection').style.display = (dept === 'TOP YOKE') ? 'block' : 'none';
      document.getElementById('tankFabricationSection').style.display = (dept === 'TANK FABRICATION') ? 'block' : 'none';
      document.getElementById('ratioSection').style.display = (dept === 'RATIO') ? 'block' : 'none'; 
      document.getElementById('paintShopSection').style.display = (dept === 'PAINT SHOP') ? 'block' : 'none';
      document.getElementById('windingSection').style.display = (dept === 'WINDING') ? 'block' : 'none';
      document.getElementById('lvConnectionSection').style.display = (dept === 'LV CONNECTION') ? 'block' : 'none';
      document.getElementById('hvConnectionSection').style.display = (dept === 'HV CONNECTION') ? 'block' : 'none';
      
      // Re-apply auto-fill if we have fetched data
      if (window.fetchedDesign && window.fetchedKVA) {
        autoFillDesignKVA(window.fetchedDesign, window.fetchedKVA);
      }
    }

    function openProblemModal() {
      document.getElementById('problemModal').style.display = 'block';
    }

    function closeProblemModal() {
      document.getElementById('problemModal').style.display = 'none';
      document.getElementById('problemForm').reset();
    }

    window.onclick = function(event) {
      const modal = document.getElementById('problemModal');
      if (event.target === modal) {
        closeProblemModal();
      }
    }

    // Auto-fetch when job number field loses focus (on Tab or click outside)
    document.getElementById('jobNumber').addEventListener('blur', function() {
      const jobNumber = this.value.trim();
      if (jobNumber) {
        fetchDesignData(jobNumber);
      }
    });

    // Also fetch on Enter key
    document.getElementById('jobNumber').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        const jobNumber = this.value.trim();
        if (jobNumber) {
          fetchDesignData(jobNumber);
          // Move focus to next field
          document.getElementById('department').focus();
        }
      }
    });

    function fetchDesignData(jobNumber) {
      fetch(SCRIPT_URL + "?action=getDesign&jobNumber=" + encodeURIComponent(jobNumber))
        .then(response => response.json())
        .then(data => {
          if (data.success) {
            // Store fetched values globally
            window.fetchedDesign = data.design;
            window.fetchedKVA = data.kva;
            
            // Update hidden fields
            document.getElementById('fetchedDesign').value = data.design;
            document.getElementById('fetchedKVA').value = data.kva;
            
            // Auto-fill all design and KVA fields
            autoFillDesignKVA(data.design, data.kva);
            
          } else {
            // Clear fields if job not found
            clearDesignFields();
          }
        })
        .catch(error => {
          console.error("Error fetching design data:", error);
        });
    }

    function autoFillDesignKVA(design, kva) {
      // List of all design input IDs
      const designInputs = [
        'coreDesignInput', 'coilDesignInput', 'meggerDesignInput', 'fabLidDesignInput',
        'ovenOutDesignInput', 'ovenInDesignInput', 'tankUpDesignInput', 'testingDesignInput',
        'topYokeDesignInput', 'tankFabDesignInput', 'ratioDesignInput', 'paintDesignInput',
        'windingDesignInput', 'lvDesignInput', 'hvDesignInput'
      ];
      
      // List of all KVA input IDs
      const kvaInputs = [
        'coreKVAInput', 'coilKVAInput', 'meggerKVAInput', 'fabLidKVAInput',
        'ovenOutKVAInput', 'ovenInKVAInput', 'tankUpKVAInput', 'testingKVAInput',
        'topYokeKVAInput', 'tankFabKVAInput', 'ratioKVAInput', 'paintKVAInput',
        'windingKVAInput', 'lvKVAInput', 'hvKVAInput'
      ];
      
      // Fill all design inputs
      designInputs.forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          el.value = design;
          el.classList.add('auto-filled');
        }
      });
      
      // Fill all KVA inputs
      kvaInputs.forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          el.value = kva;
          el.classList.add('auto-filled');
        }
      });
    }

    function clearDesignFields() {
      window.fetchedDesign = null;
      window.fetchedKVA = null;
      
      document.getElementById('fetchedDesign').value = '';
      document.getElementById('fetchedKVA').value = '';
      
      // Clear all auto-filled fields
      document.querySelectorAll('.auto-filled').forEach(el => {
        el.value = '';
        el.classList.remove('auto-filled');
      });
    }

    window.onload = function() {
      const jobParam = getParam('job');
      if (jobParam) {
        document.getElementById('jobNumber').value = jobParam;
        document.getElementById('jobNumber').setAttribute('readonly', true);
        fetchDesignData(jobParam);
      }
    }

    // Main Form Submission
    document.getElementById("jobForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const form = e.target;
      const formData = new FormData(form);
      const data = new URLSearchParams();
      const groupedValues = {};

      for (const [key, value] of formData.entries()) {
        if (groupedValues[key]) {
          groupedValues[key].push(value);
        } else {
          groupedValues[key] = [value];
        }
      }

      for (const key in groupedValues) {
        data.append(key, groupedValues[key].join(", "));
      }

      fetch(SCRIPT_URL, {
        method: "POST",
        body: data,
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded'
        }
      })
      .then(response => response.text())
      .then(result => {
        alert("Form submitted successfully!");
        form.reset();
        clearDesignFields();
      })
      .catch(error => {
        alert("Error submitting form: " + error.message);
      });
    });

    // Problem Form Submission
    document.getElementById("problemForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const form = e.target;
      const formData = new FormData(form);
      const fileInput = document.getElementById('problemPhoto');
      const file = fileInput.files[0];

      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          const base64Data = event.target.result;
          submitProblemReport(formData, base64Data, file.name);
        };
        reader.readAsDataURL(file);
      } else {
        submitProblemReport(formData, null, null);
      }
    });

    function submitProblemReport(formData, photoData, fileName) {
      const data = new URLSearchParams();
      data.append('formType', 'problem');
      data.append('problemDepartment', formData.get('problemDepartment'));
      data.append('issueType', formData.get('issueType'));
      data.append('problemDescription', formData.get('problemDescription'));
      
      if (photoData) {
        data.append('photoData', photoData);
        data.append('fileName', fileName);
      }

      fetch(SCRIPT_URL, {
        method: "POST",
        body: data,
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded'
        }
      })
      .then(response => response.text())
      .then(result => {
        alert("Problem report submitted successfully!");
        closeProblemModal();
      })
      .catch(error => {
        alert("Error submitting problem report: " + error.message);
      });
    }
  </script>
</body>
</html>
